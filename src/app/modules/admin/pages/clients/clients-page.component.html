<div class="clients-page fade-in-up">

  <app-page-header title="Clientes" icon="business" [subtitle]="clients().length + ' clientes registrados'">
    <button mat-stroked-button (click)="openNewClientDialog()">
      <mat-icon>add</mat-icon> Nuevo cliente
    </button>
  </app-page-header>

  <div class="card">
    <mat-progress-bar *ngIf="loading()" mode="indeterminate"></mat-progress-bar>

    <table mat-table [dataSource]="clients()" class="w-full">

      <ng-container matColumnDef="nombre">
        <th mat-header-cell *matHeaderCellDef>Cliente</th>
        <td mat-cell *matCellDef="let c">
          <div class="client-name-cell">
            <div class="client-name-cell__badge" [style.background-color]="c.color_marca || 'var(--color-primary-dim)'">
              {{ c.nombre.charAt(0) }}
            </div>
            <div>
              <div style="font-weight: 500;">{{ c.nombre }}</div>
              <div class="mono text-muted" style="font-size: 11px;">{{ c.slug }}</div>
            </div>
          </div>
        </td>
      </ng-container>

      <ng-container matColumnDef="slug">
        <th mat-header-cell *matHeaderCellDef>Grupo PRTG</th>
        <td mat-cell *matCellDef="let c">
          <span class="mono text-secondary" style="font-size: 12px;">{{ c.prtg_group }}</span>
        </td>
      </ng-container>

      <ng-container matColumnDef="total_usuarios">
        <th mat-header-cell *matHeaderCellDef>Usuarios</th>
        <td mat-cell *matCellDef="let c">
          <span class="mono">{{ c.total_usuarios || 0 }}</span>
        </td>
      </ng-container>

      <ng-container matColumnDef="ultimo_acceso">
        <th mat-header-cell *matHeaderCellDef>Último acceso</th>
        <td mat-cell *matCellDef="let c">
          <span class="text-secondary" style="font-size: 12px;">
            {{ c.ultimo_acceso_usuario ? (c.ultimo_acceso_usuario | date:'dd/MM/yy HH:mm') : '—' }}
          </span>
        </td>
      </ng-container>

      <ng-container matColumnDef="activo">
        <th mat-header-cell *matHeaderCellDef>Estado</th>
        <td mat-cell *matCellDef="let c">
          <app-status-badge [status]="c.activo ? 'ok' : 'paused'"
            [label]="c.activo ? 'Activo' : 'Inactivo'"></app-status-badge>
        </td>
      </ng-container>

      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let c">
          <ng-container *ngIf="c.slug !== 'ondra'; else systemBadge">
            <button mat-icon-button [matMenuTriggerFor]="menu">
              <mat-icon>more_vert</mat-icon>
            </button>
            <mat-menu #menu="matMenu">
              <button mat-menu-item (click)="openEditClientDialog(c)">
                <mat-icon>edit</mat-icon> Editar
              </button>
              <button mat-menu-item (click)="toggleStatus(c)">
                <mat-icon>{{ c.activo ? 'block' : 'check_circle' }}</mat-icon>
                {{ c.activo ? 'Desactivar' : 'Activar' }}
              </button>
              <mat-divider></mat-divider>
              <button mat-menu-item class="menu-item--danger" (click)="deleteClient(c)">
                <mat-icon>delete</mat-icon> Eliminar
              </button>
            </mat-menu>
          </ng-container>
          <ng-template #systemBadge>
            <span class="system-badge">
              <mat-icon>lock</mat-icon> Sistema
            </span>
          </ng-template>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedCols"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedCols;"></tr>

    </table>

    <div *ngIf="!loading() && clients().length === 0" class="empty-table-state">
      <mat-icon>business_center</mat-icon>
      <span>No hay clientes registrados</span>
    </div>
  </div>

</div>
