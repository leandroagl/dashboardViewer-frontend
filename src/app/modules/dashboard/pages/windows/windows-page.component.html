<div class="windows-page fade-in-up" *ngIf="!loading(); else loadingTpl">
  <app-page-header title="Windows Server" icon="computer" subtitle="Estado de todos los servidores Windows del cliente">
    <span class="last-updated" *ngIf="lastUpdated()">{{ lastUpdated() | date:'HH:mm:ss' }}</span>
  </app-page-header>

  <div class="error-banner" *ngIf="error()">
    <mat-icon>error_outline</mat-icon> {{ error() }}
    <button mat-button (click)="retry()">Reintentar</button>
  </div>

  <ng-container *ngIf="data() as d">

    <!-- KPI Strip -->
    <div class="kpi-strip">
      <app-kpi-card label="Servers OK"      [value]="serversOk(d)"                           status="ok"></app-kpi-card>
      <app-kpi-card label="Servers Warning" [value]="serversWarn(d)"                         status="warning"></app-kpi-card>
      <app-kpi-card label="Alertas activas" [value]="d.alerts.length" [status]="alertsStatus(d)"></app-kpi-card>
      <app-kpi-card label="Uptime promedio" [value]="formatUptimeAvg(d.uptimeAvgHours ?? 0)" status="ok"></app-kpi-card>
    </div>

    <!-- Server Cards -->
    <div class="server-cards">
      <div
        *ngFor="let srv of d.servers"
        class="server-card server-card--{{ srv.status }}"
      >
        <!-- Header -->
        <div class="server-card__header">
          <app-status-badge [status]="srv.status"></app-status-badge>
          <span class="server-card__name">{{ srv.name }}</span>
        </div>

        <!-- Metric Rows -->
        <div class="metric-rows">

          <!-- CPU -->
          <div class="metric-row">
            <span class="metric-row__name">CPU</span>
            <div class="metric-row__bar-wrap">
              <div class="metric-row__bar metric-row__bar--{{ srv.cpu.status }}"
                [style.width.%]="parseValue(srv.cpu.value)"></div>
            </div>
            <span class="metric-row__val mono metric-row__val--{{ srv.cpu.status }}">{{ srv.cpu.value }}</span>
            <app-sparkline [values]="cpuSparkValues(d, srv)" [color]="statusColor(srv.cpu.status)"></app-sparkline>
          </div>

          <!-- RAM -->
          <div class="metric-row">
            <span class="metric-row__name">RAM</span>
            <div class="metric-row__bar-wrap">
              <div class="metric-row__bar metric-row__bar--{{ srv.memory.status }}"
                [style.width.%]="parseValue(srv.memory.value)"></div>
            </div>
            <span class="metric-row__val mono metric-row__val--{{ srv.memory.status }}">{{ srv.memory.value }}</span>
            <app-sparkline [values]="ramSparkValues(d, srv)" [color]="statusColor(srv.memory.status)"></app-sparkline>
          </div>

          <!-- Disco -->
          <div class="metric-row">
            <span class="metric-row__name">Disco</span>
            <div class="metric-row__bar-wrap">
              <div class="metric-row__bar metric-row__bar--{{ srv.disk.status }}"
                [style.width.%]="parseValue(srv.disk.value)"></div>
            </div>
            <span class="metric-row__val mono metric-row__val--{{ srv.disk.status }}">{{ srv.disk.value }}</span>
            <app-sparkline [values]="diskSparkValues(d, srv)" [color]="statusColor(srv.disk.status)"></app-sparkline>
          </div>

          <!-- Uptime — sin barra ni sparkline -->
          <div class="metric-row">
            <span class="metric-row__name">Uptime</span>
            <div class="metric-row__bar-wrap metric-row__bar-wrap--empty"></div>
            <span class="metric-row__val mono">{{ srv.uptime.value }}</span>
            <span></span>
          </div>

        </div>
      </div>
    </div>

    <!-- Alerts -->
    <div class="alerts-section" *ngIf="d.alerts.length > 0">
      <app-alert-list [alerts]="d.alerts"></app-alert-list>
    </div>

  </ng-container>
</div>

<ng-template #loadingTpl>
  <div style="padding: 8px;">
    <div class="skeleton" style="height: 32px; width: 200px; margin-bottom: 24px;"></div>
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
      <div class="skeleton" style="height: 200px;"></div>
      <div class="skeleton" style="height: 200px;"></div>
    </div>
  </div>
</ng-template>
