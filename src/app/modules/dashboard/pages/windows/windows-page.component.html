<div class="windows-page fade-in-up" *ngIf="!loading(); else loadingTpl">
  <app-page-header title="Windows Server" icon="computer" subtitle="Estado de todos los servidores Windows del cliente">
    <span class="last-updated" *ngIf="lastUpdated()">{{ lastUpdated() | date:'HH:mm:ss' }}</span>
  </app-page-header>

  <div class="error-banner" *ngIf="error()">
    <mat-icon>error_outline</mat-icon> {{ error() }}
    <button mat-button (click)="retry()">Reintentar</button>
  </div>

  <ng-container *ngIf="data() as d">

    <!-- KPI Strip -->
    <div class="kpi-strip">
      <app-kpi-card label="Servers OK"      [value]="serversOk(d)"                           status="ok"></app-kpi-card>
      <app-kpi-card label="Servers Warning" [value]="serversWarn(d)"                         status="warning"></app-kpi-card>
      <app-kpi-card label="Alertas activas" [value]="d.alerts.length" [status]="alertsStatus(d)"></app-kpi-card>
      <app-kpi-card label="Uptime promedio" [value]="formatUptimeAvg(d.uptimeAvgHours ?? 0)" status="ok"></app-kpi-card>
    </div>

    <!-- Server Cards: flat grid when all OK, split layout when there are alerts -->
    <ng-container *ngIf="alertingServers(d).length === 0; else splitView">
      <div class="server-cards">
        <ng-container *ngFor="let srv of d.servers">
          <ng-container *ngTemplateOutlet="serverCardTpl; context: { $implicit: srv, d: d }"></ng-container>
        </ng-container>
      </div>
    </ng-container>

    <ng-template #splitView>
      <div class="server-cards-split">
        <div class="server-group server-group--ok" *ngIf="okServersOf(d).length > 0">
          <ng-container *ngFor="let srv of okServersOf(d)">
            <ng-container *ngTemplateOutlet="serverCardTpl; context: { $implicit: srv, d: d }"></ng-container>
          </ng-container>
        </div>
        <div class="server-group server-group--alerts">
          <div class="server-col">
            <ng-container *ngFor="let srv of alertingCol1(d)">
              <ng-container *ngTemplateOutlet="serverCardTpl; context: { $implicit: srv, d: d }"></ng-container>
            </ng-container>
          </div>
          <div class="server-col">
            <ng-container *ngFor="let srv of alertingCol2(d)">
              <ng-container *ngTemplateOutlet="serverCardTpl; context: { $implicit: srv, d: d }"></ng-container>
            </ng-container>
          </div>
        </div>
      </div>
    </ng-template>

    <!-- Reusable card template -->
    <ng-template #serverCardTpl let-srv let-d="d">
      <div class="server-card server-card--{{ srv.status }}">

        <!-- Header -->
        <div class="server-card__header">
          <app-status-badge [status]="srv.status"></app-status-badge>
          <span class="server-card__name">{{ srv.name }}</span>
          <span class="server-card__uptime mono">Uptime {{ srv.uptime.value }}</span>
        </div>

        <!-- Metric Rows -->
        <div class="metric-rows">
          <app-metric-row label="CPU"   [value]="srv.cpu.value"    [status]="srv.cpu.status"    [pct]="parseValue(srv.cpu.value)"    [sparkValues]="cpuSparkValues(d, srv)"></app-metric-row>
          <app-metric-row label="RAM"   [value]="srv.memory.value" [status]="srv.memory.status" [pct]="parseValue(srv.memory.value)" [sparkValues]="ramSparkValues(d, srv)"></app-metric-row>
          <app-metric-row label="Disco" [value]="srv.disk.value"   [status]="srv.disk.status"   [pct]="parseValue(srv.disk.value)"   [sparkValues]="diskSparkValues(d, srv)"></app-metric-row>
        </div>

        <!-- Per-server alerts -->
        <app-alert-list
          *ngIf="serverAlerts(d, srv).length > 0"
          [alerts]="serverAlerts(d, srv)"
        ></app-alert-list>

        <!-- History panel -->
        <app-device-detail-panel
          *ngIf="expandedServers().has(srv.name)"
          [objid]="serverObjids(d, srv)['cpu']"
          [slug]="clientSlug()"
          [label]="srv.name"
          [channels]="[
            { key: 'cpu',      label: 'CPU' },
            { key: 'ram',      label: 'RAM' },
            { key: 'diskFree', label: 'Disco Libre' }
          ]"
          [channelObjids]="serverObjids(d, srv)"
          [channelUnits]="{ diskFree: '%' }"
          [channelInvert]="{ ram: true }"
        ></app-device-detail-panel>

        <!-- History toggle -->
        <button
          class="server-card__toggle"
          [class.active]="expandedServers().has(srv.name)"
          (click)="toggleHistory(srv.name)"
        >
          <mat-icon>{{ expandedServers().has(srv.name) ? 'expand_less' : 'show_chart' }}</mat-icon>
          {{ expandedServers().has(srv.name) ? 'Ocultar historial' : 'Ver historial' }}
        </button>

      </div>
    </ng-template>

  </ng-container>
</div>

<ng-template #loadingTpl>
  <div style="padding: 8px;">
    <div class="skeleton" style="height: 32px; width: 200px; margin-bottom: 24px;"></div>
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
      <div class="skeleton" style="height: 200px;"></div>
      <div class="skeleton" style="height: 200px;"></div>
    </div>
  </div>
</ng-template>
