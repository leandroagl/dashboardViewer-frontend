<div class="networking-page fade-in-up" *ngIf="!loading(); else loadingTpl">
  <app-page-header title="Networking" icon="router" subtitle="Estado de equipos de red y conectividad">
  </app-page-header>

  <ng-container *ngIf="data() as d">
    <div class="net-kpis">
      <app-kpi-card label="Dispositivos" [value]="totalDevicesCount(d)" status="ok"                     sublabel="monitoreados"></app-kpi-card>
      <app-kpi-card label="Con errores"  [value]="devicesErrorCount(d)" [status]="devicesErrorStatus(d)" sublabel="dispositivos"></app-kpi-card>
      <app-kpi-card label="Alertas"      [value]="d.alerts.length"      [status]="alertsStatus(d)"       sublabel="activas"></app-kpi-card>
    </div>

    <div class="net-body">

      <!-- Columna izquierda: todas las secciones de dispositivos -->
      <div class="net-devices-col">

        <!-- Dispositivos de red (routers, firewalls) -->
        <div *ngIf="d.devices.length > 0">
          <div class="section-label">Dispositivos de red</div>
          <div class="devices-grid">
            <div class="card" *ngFor="let device of d.devices">
              <div class="card__header">
                <div class="device-header">
                  <mat-icon class="device-header__icon">router</mat-icon>
                  <span class="device-header__name">{{ device.name }}</span>
                </div>
              </div>
              <div class="card__body">
                <div class="sensor-grid">
                  <div *ngFor="let sensor of device.sensors" class="sensor-row">
                    <span class="sensor-row__name">{{ sensor.name }}</span>
                    <span class="mono sensor-row__value">{{ sensor.value }}</span>
                    <app-status-badge [status]="sensor.status"></app-status-badge>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Switches -->
        <div *ngIf="d.switches.length > 0">
          <div class="section-label">Switches</div>
          <div class="ping-grid">
            <div class="card ping-card" *ngFor="let device of d.switches">
              <div class="card__header">
                <mat-icon class="device-header__icon">hub</mat-icon>
                <span class="device-header__name">{{ device.name }}</span>
                <span class="ping-dot ping-dot--{{ device.status }}"></span>
              </div>
            </div>
          </div>
        </div>

        <!-- Antenas PTP -->
        <div *ngIf="d.ptpAntennas.length > 0">
          <div class="section-label">Antenas PTP</div>
          <div class="ping-grid">
            <div class="card ping-card" *ngFor="let device of d.ptpAntennas">
              <div class="card__header">
                <mat-icon class="device-header__icon">cell_tower</mat-icon>
                <span class="device-header__name">{{ device.name }}</span>
                <span class="ping-dot ping-dot--{{ device.status }}"></span>
              </div>
            </div>
          </div>
        </div>

        <!-- Sin dispositivos en ninguna categoría -->
        <div *ngIf="totalDevicesCount(d) === 0" class="empty-state">
          <mat-icon>info</mat-icon> Sin dispositivos de red detectados
        </div>

      </div>

      <!-- Columna derecha: alertas -->
      <div class="alerts-panel">
        <div class="section-label">Alertas activas</div>
        <div class="card">
          <div class="card__body">
            <app-alert-list [alerts]="d.alerts"></app-alert-list>
          </div>
        </div>
      </div>

    </div>
  </ng-container>
</div>

<ng-template #loadingTpl>
  <div style="padding: 8px;">
    <div class="skeleton" style="height: 32px; width: 200px; margin-bottom: 24px;"></div>
    <div class="skeleton" style="height: 180px; margin-bottom: 16px;"></div>
    <div class="skeleton" style="height: 180px;"></div>
  </div>
</ng-template>
